# Configuracion de build para Railway
# NO sobrescribimos la fase install: nixpacks crea el venv e instala requirements.txt automaticamente.
[phases.setup]
nixPkgs = ["python3", "gcc", "stdenv.cc.cc.lib"]

[variables]
CUDA_VISIBLE_DEVICES = "-1"
TOKENIZERS_PARALLELISM = "false"
HF_HUB_DISABLE_PROGRESS_BARS = "1"
NIXPACKS_PYTHON_VERSION = "3.13"
